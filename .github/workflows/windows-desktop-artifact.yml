name: EchoDesk Windows x64 package

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: "unsigned preview or Authenticode-signed package"
        required: true
        default: unsigned
        type: choice
        options:
          - unsigned
          - signed

permissions:
  contents: read

concurrency:
  group: echodesk-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-windows-x64:
    name: Package EchoDesk Windows x64
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout EchoDesk snapshot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The frozen backend spec imports the private shared gateway package.
      # The token is read by Actions only; it is never written into the build.
      - name: Checkout shared model gateway source
        uses: actions/checkout@v4
        with:
          repository: yoligehude14753/yoli-platform
          ref: main
          path: _platforms
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            llm/pyproject.toml
            llm/src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.0.0"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/packaging/requirements-build.lock

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install packaged artifact runtime dependencies
        working-directory: backend/app/adapters/skill/assets/ppt_ib_deck
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install backend freezing dependencies
        working-directory: backend
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r packaging/requirements-build.lock
          python -m pip install PyInstaller loguru==0.7.3

      - name: Verify typography contract
        working-directory: desktop
        run: node --test electron/tests/renderer-typography-contract.test.cjs

      - name: Configure Authenticode certificate
        if: ${{ inputs.release_mode == 'signed' }}
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.ECHODESK_WINDOWS_CERTIFICATE_PFX_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.ECHODESK_WINDOWS_CERTIFICATE_PASSWORD }}
          CERTIFICATE_SHA1: ${{ secrets.ECHODESK_WINDOWS_CERTIFICATE_SHA1 }}
          EXPECTED_PUBLISHER: ${{ secrets.ECHODESK_WINDOWS_EXPECTED_PUBLISHER }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("CERTIFICATE_BASE64", "CERTIFICATE_PASSWORD", "CERTIFICATE_SHA1", "EXPECTED_PUBLISHER")) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "Signed mode requires secret $name"
            }
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "echodesk-windows-release.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "CSC_LINK=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSC_KEY_PASSWORD=$env:CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ECHODESK_WINDOWS_CERTIFICATE_SHA1=$env:CERTIFICATE_SHA1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ECHODESK_WINDOWS_EXPECTED_PUBLISHER=$env:EXPECTED_PUBLISHER" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows package
        working-directory: desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ECHODESK_SHARED_LLM_ROOT: ${{ github.workspace }}\\_platforms\\llm\\src
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ inputs.release_mode }}" -eq "signed") {
            npm.cmd run app:dist:win
          } else {
            npm.cmd run app:dist:win:unsigned-test
          }

      - name: Verify expected release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = node -p "require('./desktop/package.json').version"
          $required = @(
            "desktop/release/EchoDesk.Setup.$version.exe",
            "desktop/release/EchoDesk-$version-win-x64.zip",
            "desktop/release/win-unpacked/EchoDesk.exe",
            "desktop/release/win-unpacked/resources/backend/echodesk-backend.exe",
            "desktop/release/latest.yml"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing Windows release output: $path"
            }
          }

      - name: Create checksums and package manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = node -p "require('./desktop/package.json').version"
          $release = Resolve-Path "desktop/release"
          $files = @(
            (Join-Path $release "EchoDesk.Setup.$version.exe"),
            (Join-Path $release "EchoDesk-$version-win-x64.zip"),
            (Join-Path $release "latest.yml")
          )
          $records = foreach ($file in $files) {
            $hash = Get-FileHash -LiteralPath $file -Algorithm SHA256
            [PSCustomObject]@{ name = Split-Path $file -Leaf; bytes = (Get-Item $file).Length; sha256 = $hash.Hash.ToLowerInvariant() }
          }
          $manifest = [PSCustomObject]@{
            product = "EchoDesk"
            version = $version
            platform = "windows-x64"
            release_mode = "${{ inputs.release_mode }}"
            source_sha = "${{ github.sha }}"
            artifacts = @($records)
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $release "WINDOWS-MANIFEST.json") -Encoding utf8

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: echodesk-windows-x64-${{ inputs.release_mode }}-${{ github.sha }}
          path: |
            desktop/release/EchoDesk.Setup.*.exe
            desktop/release/EchoDesk.Setup.*.exe.blockmap
            desktop/release/EchoDesk-*-win-x64.zip
            desktop/release/latest.yml
            desktop/release/WINDOWS-MANIFEST.json
          if-no-files-found: error
          retention-days: 14
