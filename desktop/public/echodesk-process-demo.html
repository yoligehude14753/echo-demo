<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="EchoDesk 过程、模型与动态 HTML 演示" />
    <title>EchoDesk · Process Studio</title>
    <style>
      :root {
        --paper: #f3f1eb;
        --surface: #fbfbf8;
        --ink: #152321;
        --muted: #70817b;
        --line: #d7e0da;
        --green: #0c806e;
        --green-soft: #e6f4ee;
        --amber: #c17d22;
        --shadow: 0 24px 72px rgba(30, 63, 53, 0.14);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 0%, rgba(168, 228, 208, 0.55), transparent 32%),
          radial-gradient(circle at 90% 16%, rgba(220, 197, 154, 0.28), transparent 28%),
          var(--paper);
        font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .page { width: min(1180px, calc(100% - 36px)); margin: 0 auto; padding: 42px 0 56px; }
      .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
      .eyebrow { color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: .18em; }
      h1 { margin: 7px 0 0; font-size: clamp(30px, 5vw, 52px); line-height: 1.03; letter-spacing: -.045em; }
      .lede { max-width: 580px; margin: 13px 0 0; color: var(--muted); font-size: 14px; line-height: 1.75; }
      .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
      button, select { font: inherit; }
      button, select { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--ink); background: rgba(255,255,255,.72); cursor: pointer; }
      button:hover, select:hover { border-color: rgba(12,128,110,.5); background: #fff; }
      button.primary { border-color: var(--green); color: #fff; background: var(--green); }
      button.primary:hover { background: #086b5d; }
      .board { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); gap: 16px; }
      .panel { overflow: hidden; border: 1px solid var(--line); border-radius: 22px; background: rgba(251,251,248,.92); box-shadow: var(--shadow); }
      .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 19px 22px; border-bottom: 1px solid var(--line); }
      .panel-head h2 { margin: 0; font-size: 15px; }
      .panel-head span { color: var(--muted); font-size: 11px; }
      .timeline { margin: 0; padding: 24px 24px 13px; list-style: none; }
      .step { position: relative; display: grid; grid-template-columns: 20px 1fr auto; gap: 11px; min-height: 74px; }
      .step:not(:last-child)::after { position: absolute; top: 17px; bottom: 4px; left: 8px; width: 1px; content: ""; background: var(--line); }
      .dot { z-index: 1; width: 16px; height: 16px; margin-top: 1px; border: 4px solid #edf4ef; border-radius: 50%; background: #b8c7bf; }
      .step.done .dot { background: var(--green); }
      .step.active .dot { background: var(--amber); animation: pulse 1.1s infinite; }
      .step h3 { margin: 0; font-size: 13px; }
      .step p { margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.55; }
      .step time { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
      .model-strip { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 24px 22px; }
      .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; color: var(--muted); background: #fff; font-size: 11px; }
      .chip b { color: var(--ink); font-weight: 650; }
      .preview { min-height: 510px; padding: 22px; background: linear-gradient(145deg, #102c27, #1c473c); color: #f3fff9; }
      .preview-kicker { color: #a9e5d4; font-size: 10px; font-weight: 700; letter-spacing: .16em; }
      .preview h2 { margin: 9px 0 6px; font-size: 25px; letter-spacing: -.03em; }
      .preview-copy { max-width: 480px; margin: 0; color: #bad6cc; font-size: 12px; line-height: 1.7; }
      .chart { display: grid; grid-template-columns: repeat(12, 1fr); align-items: end; gap: 7px; height: 180px; margin-top: 28px; padding: 18px; border: 1px solid rgba(194, 245, 228, .18); border-radius: 16px; background: rgba(0,0,0,.13); }
      .bar { height: var(--h); border-radius: 5px 5px 2px 2px; background: linear-gradient(180deg, #a9e5d4, #55b99d); transform-origin: bottom; animation: grow .8s both; animation-delay: calc(var(--i) * 70ms); }
      .artifact-card { display: flex; align-items: center; gap: 11px; margin-top: 18px; border: 1px solid rgba(194,245,228,.2); border-radius: 14px; padding: 13px; background: rgba(255,255,255,.08); }
      .artifact-icon { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 10px; background: #a9e5d4; color: #103a30; font-weight: 800; }
      .artifact-card strong { display: block; font-size: 13px; }
      .artifact-card small { display: block; margin-top: 3px; color: #b9d8ce; font-size: 10px; }
      .footer-note { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; color: var(--muted); font-size: 11px; }
      .signal { width: 140px; height: 4px; border-radius: 999px; background: linear-gradient(90deg, transparent, #7ed2b8, transparent); background-size: 200% 100%; animation: flow 1.8s linear infinite; }
      @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(193,125,34,.18); } }
      @keyframes grow { from { transform: scaleY(0); opacity: .3; } to { transform: scaleY(1); opacity: 1; } }
      @keyframes flow { to { background-position: -200% 0; } }
      @media (max-width: 820px) { .topbar { align-items: flex-start; flex-direction: column; } .controls { justify-content: flex-start; } .board { grid-template-columns: 1fr; } .preview { min-height: 390px; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="topbar">
        <div>
          <div class="eyebrow">ECHODESK · PROCESS STUDIO</div>
          <h1>让每一次生成<br />都能被看见。</h1>
          <p class="lede">一个可回放的过程面板：步骤来自事件，模型来自运行回执，右侧是随过程更新的动态 HTML 产物预览。</p>
        </div>
        <div class="controls">
          <select id="model" aria-label="选择演示模型">
            <option value="qwen3.5-35b-a3b">qwen3.5-35b-a3b</option>
            <option value="qwen3-asr-1.7b">qwen3-asr-1.7b</option>
          </select>
          <button id="replay" type="button">重新播放</button>
          <button id="start" type="button" class="primary">开始演示</button>
        </div>
      </div>

      <section class="board" aria-label="EchoDesk 过程与动态 HTML">
        <article class="panel">
          <div class="panel-head"><h2>过程展示</h2><span id="status">等待开始</span></div>
          <ol class="timeline" id="timeline"></ol>
          <div class="model-strip">
            <span class="chip">模型 <b id="model-value">qwen3.5-35b-a3b</b></span>
            <span class="chip">路径 <b>资料 → 生成 → 预览</b></span>
            <span class="chip">证据 <b>事件回执</b></span>
          </div>
        </article>

        <article class="panel preview" aria-live="polite">
          <div class="preview-kicker">LIVE HTML ARTIFACT</div>
          <h2 id="artifact-title">动态会议看板</h2>
          <p class="preview-copy" id="artifact-copy">点击“开始演示”，观察过程步骤和 HTML 产物如何同步推进。</p>
          <div class="chart" id="chart" aria-label="动态指标图"></div>
          <div class="artifact-card"><div class="artifact-icon">HTML</div><div><strong>echodesk-process-studio.html</strong><small id="artifact-meta">等待产物回执 · 模型未开始</small></div></div>
          <div class="footer-note"><span>本页无需网络依赖，可直接打开</span><span class="signal"></span></div>
        </article>
      </section>
    </main>

    <script>
      (() => {
        const steps = [
          ["request", "接收请求", "已建立本次过程追踪"],
          ["context", "关联上下文", "读取会议、知识库与可用资料"],
          ["model", "调用模型", "运行时模型身份由网关回执确认"],
          ["render", "生成动态 HTML", "把结构、指标和交互写入单文件产物"],
          ["ready", "质量检查与预览", "HTML 已就绪，可以打开或下载"],
        ];
        const timeline = document.querySelector("#timeline");
        const status = document.querySelector("#status");
        const model = document.querySelector("#model");
        const modelValue = document.querySelector("#model-value");
        const artifactCopy = document.querySelector("#artifact-copy");
        const artifactMeta = document.querySelector("#artifact-meta");
        const chart = document.querySelector("#chart");
        let timer = null;
        let cursor = -1;

        const now = () => new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
        const renderChart = (active) => {
          chart.innerHTML = Array.from({ length: 12 }, (_, i) => `<span class="bar" style="--i:${i};--h:${Math.max(18, 34 + ((i * 17 + Math.max(active, 0) * 11) % 115))}px"></span>`).join("");
        };
        const render = () => {
          timeline.innerHTML = steps.map((item, index) => {
            const state = index < cursor ? "done" : index === cursor ? "active" : "";
            return `<li class="step ${state}"><span class="dot"></span><div><h3>${item[1]}</h3><p>${item[2]}</p></div><time>${state ? now() : "—"}</time></li>`;
          }).join("");
          const selected = model.value;
          modelValue.textContent = selected;
          if (cursor < 0) {
            status.textContent = "等待开始";
            artifactCopy.textContent = "点击“开始演示”，观察过程步骤和 HTML 产物如何同步推进。";
            artifactMeta.textContent = "等待产物回执 · 模型未开始";
          } else if (cursor < steps.length - 1) {
            status.textContent = `处理中 · ${cursor + 1}/${steps.length}`;
            artifactCopy.textContent = `${steps[cursor][1]}：${steps[cursor][2]}`;
            artifactMeta.textContent = `生成中 · ${selected}`;
          } else {
            status.textContent = "已完成";
            artifactCopy.textContent = "动态 HTML 已生成，过程卡、模型身份与预览内容均已对齐。";
            artifactMeta.textContent = `已确认 · ${selected} · 预览就绪`;
          }
          renderChart(cursor);
        };
        const stop = () => { if (timer) window.clearInterval(timer); timer = null; };
        const play = () => {
          stop();
          cursor = 0;
          render();
          timer = window.setInterval(() => {
            cursor += 1;
            render();
            if (cursor >= steps.length - 1) stop();
          }, 900);
        };
        document.querySelector("#start").addEventListener("click", play);
        document.querySelector("#replay").addEventListener("click", play);
        model.addEventListener("change", () => { modelValue.textContent = model.value; if (cursor >= steps.length - 1) render(); });
        render();
      })();
    </script>
  </body>
</html>
